site_name: "HaDes-V: Informe Técnico de Arquitectura"
site_description: "Procesador RISC-V (RV32I)"
site_author: "Julián Hinojosa Gil"

theme:
  name: material
  language: es
  icon:
    logo: material/chip          # Icono de procesador/microchip en la cabecera
    repo: fontawesome/brands/github
  palette:
    # Modo Claro (Estilo Silicio / Clean Engineering)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    # Modo Oscuro (Estilo IDE / Vivado Terminal)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.top
    - navigation.tracking
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:             # <--- ESTO HABILITA LOS ICONOS TIPO :material-...:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg