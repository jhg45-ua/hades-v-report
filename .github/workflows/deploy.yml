name: Compilar LaTeX, TikZ, Cajas y Desplegar Web

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Obtener el código fuente
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Compilar PDF oficial con XeLaTeX
      - name: Compilar LaTeX a PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: latex/informe.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: true
          args: "-pdf -file-line-error -interaction=nonstopmode"

      # 3. Copiar PDF compilado para descarga web
      - name: Preparar PDF para la web
        run: |
          mkdir -p docs/assets
          if [ -f "latex/informe.pdf" ]; then
            cp latex/informe.pdf docs/assets/HaDes_V_Informe_Tecnico.pdf
          elif [ -f "informe.pdf" ]; then
            cp informe.pdf docs/assets/HaDes_V_Informe_Tecnico.pdf
          fi

      # 4. Instalar herramientas para renderizar TikZ y Pandoc
      - name: Instalar dependencias de conversión web
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc pdf2svg texlive-latex-extra texlive-pictures wget python3

      # 5. Preprocesar LaTeX (Marcado de cajas y tablas)
      - name: Preprocesar LaTeX
        run: |
          cat << 'EOF' > preprocess_latex.py
          import re

          with open("latex/informe.tex", "r", encoding="utf-8") as f:
              content = f.read()

          # Eliminar comandos Babel de llaves complejas que interfieren en Pandoc
          content = content.replace(r"\shorthandoff{<>}", "").replace(r"\shorthandon{<>}", "")

          # Convertir tabularx a tabular estándar
          content = re.sub(r"\\begin\{tabularx\}\{.*?\}\{(.*?)\}", r"\\begin{tabular}{\1}", content)
          content = content.replace(r"\end{tabularx}", r"\end{tabular}")

          # Reemplazar entornos de tcolorbox por marcas temporales
          def mark_concept(m):
              return f"\n\nBEGINMKDOCSINFO_{m.group(1).strip()}\n{m.group(2)}\nENDMKDOCSBOX\n\n"

          def mark_bug(m):
              return f"\n\nBEGINMKDOCSWARN_{m.group(1).strip()}\n{m.group(2)}\nENDMKDOCSBOX\n\n"

          def mark_insight(m):
              return f"\n\nBEGINMKDOCSSUCC_{m.group(1).strip()}\n{m.group(2)}\nENDMKDOCSBOX\n\n"

          content = re.sub(r"\\begin\{conceptbox\}\{(.*?)\}(.*?)\\end\{conceptbox\}", mark_concept, content, flags=re.DOTALL)
          content = re.sub(r"\\begin\{bugbox\}\{(.*?)\}(.*?)\\end\{bugbox\}", mark_bug, content, flags=re.DOTALL)
          content = re.sub(r"\\begin\{insightbox\}\{(.*?)\}(.*?)\\end\{insightbox\}", mark_insight, content, flags=re.DOTALL)

          with open("latex/informe_web.tex", "w", encoding="utf-8") as f:
              f.write(content)
          EOF

          python3 preprocess_latex.py

      # 6. Convertir LaTeX a Markdown y renderizar TikZ a SVG
      - name: Convertir LaTeX a Markdown (con TikZ a SVG)
        run: |
          mkdir -p docs/assets
          mkdir -p docs/img

          # Copiar imágenes estáticas
          if [ -d "img" ]; then cp -r img/* docs/ 2>/dev/null || true; cp -r img/* docs/img/ 2>/dev/null || true; fi
          if [ -d "latex/img" ]; then cp -r latex/img/* docs/ 2>/dev/null || true; cp -r latex/img/* docs/img/ 2>/dev/null || true; fi

          # Descargar filtro Lua oficial para convertir TikZ a SVG
          wget https://raw.githubusercontent.com/pandoc-ext/tikz/main/tikz.lua -O tikz.lua

          # Generar archivo Markdown crudo
          pandoc latex/informe_web.tex \
            -f latex \
            -t markdown-smart+pipe_tables+grid_tables+raw_html \
            --lua-filter=tikz.lua \
            --metadata=tikz-format:svg \
            --mathjax \
            --resource-path=.:latex:img:latex/img \
            -o docs/content_raw.md

          # Mover gráficos SVG generados por TikZ a la carpeta de la web
          mv *.svg docs/ 2>/dev/null || true

      # 7. Postprocesar Markdown (Crear cajas estilizadas de MkDocs Material)
      - name: Postprocesar Markdown para MkDocs
        run: |
          cat << 'EOF' > postprocess_md.py
          import re

          with open("docs/content_raw.md", "r", encoding="utf-8") as f:
              text = f.read()

          # Cabecera interactiva con botón de descarga del PDF
          header = '!!! info "Descargar Informe Técnico Completo (PDF)"\n'
          header += '    :material-file-pdf-box: **[Descargar HaDes_V_Informe_Tecnico.pdf](assets/HaDes_V_Informe_Tecnico.pdf)**\n\n'

          def convert_box(match):
              box_type = match.group(1)
              title = match.group(2).strip()
              body = match.group(3).strip()

              adm_type = "info"
              if box_type == "WARN":
                  adm_type = "warning"
              elif box_type == "SUCC":
                  adm_type = "success"

              indented_body = "\n".join("    " + line for line in body.splitlines())
              return f'\n\n!!! {adm_type} "{title}"\n{indented_body}\n\n'

          # Transformar las marcas temporales en cajas Admonition de MkDocs
          pattern = r'BEGINMKDOCS(INFO|WARN|SUCC)_(.*?)\n(.*?)ENDMKDOCSBOX'
          processed_text = re.sub(pattern, convert_box, text, flags=re.DOTALL)

          with open("docs/index.md", "w", encoding="utf-8") as f:
              f.write(header + processed_text)
          EOF

          python3 postprocess_md.py

      # 8. Configurar Python e instalar MkDocs Material
      - name: Instalar Python y MkDocs
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar MkDocs Material
        run: |
          pip install mkdocs-material

      # 9. Desplegar sitio web final
      - name: Desplegar en GitHub Pages
        run: |
          mkdocs gh-deploy --force